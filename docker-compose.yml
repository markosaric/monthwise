services:
  db:
    image: postgres:17
    container_name: monthwise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monthwise}
      POSTGRES_USER: ${POSTGRES_USER:-monthwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - monthwise-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  monthwise-db-data:
